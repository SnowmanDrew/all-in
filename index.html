<style>
:root{--night:#0b0612;--lac:#15101d;--lac2:#0e0a14;--chrome:#c3c9d4;--chrome-d:#5b6070;--pink:#ff3d9a;--cyan:#22e1ff;--amber:#ffb020;--lime:#b6f84a;--red:#ff3b5a;--ink:#f4ecff;--muted:#a79fb8;--dim:#6d6680;
  --sign:"Monoton",Impact,sans-serif;--head:"Bungee",Impact,"Arial Black",sans-serif;--body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font:500 14px/1.3 var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
.ic{width:18px;height:18px;flex:none;display:block}
#app{display:grid;grid-template-rows:46px 1fr 236px;height:100vh;width:100vw}

/* ---------- resource bar ---------- */
#top{display:flex;align-items:center;gap:22px;padding:0 14px;background:linear-gradient(180deg,#1b1524,#100b16);position:relative;z-index:3}
#top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#4b5160,#d9dee6 30%,#7d8494 70%,#3a3f4b)}
.logo{font:400 24px/1 var(--sign);color:#ffd9ec;text-shadow:0 0 4px #fff,0 0 10px var(--pink),0 0 22px var(--pink),0 0 40px rgba(255,61,154,.6);letter-spacing:.02em;margin-right:8px;animation:flick 3.5s 1 both}
@keyframes flick{0%,6%{opacity:.15}7%{opacity:1}9%{opacity:.3}11%,30%{opacity:1}31%{opacity:.5}32%,100%{opacity:1}}
.res{display:flex;align-items:center;gap:7px;color:var(--muted)}
.res b{font:400 17px/1 var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.res b small{font-size:11px;color:var(--dim)}
.res.chips{color:var(--amber)}.res.chips b{color:#ffd27a}
.minibar{width:64px;height:6px;background:#2a2235;border-radius:3px;overflow:hidden}.minibar i{display:block;height:100%;background:#4ade80;transition:width .25s}
.minibar i.mid,.hp i.mid{background:#fbbf24}.minibar i.low,.hp i.low{background:#f43f5e}
.spacer{flex:1}
.nextw{margin-left:10px;padding:4px 10px 4px 8px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:0 0 0 1px #3a3346;gap:6px;color:var(--muted)}
.nextw .nl{font-weight:700;font-size:13.5px;color:#e8e1f5;white-space:nowrap}.nextw canvas{width:22px;height:22px}.nextw .tt{color:#ffd27a;display:grid}.nextw .tt .ic{width:15px;height:15px}.nextw>.ic{width:14px;height:14px}
#ribbon .traits{display:flex;gap:6px;justify-content:center;margin-top:6px}#ribbon .traits i{font-style:normal;display:flex;align-items:center;gap:4px;font:400 10.5px var(--head);color:#ffd27a;background:rgba(255,176,32,.1);box-shadow:0 0 0 1px rgba(255,176,32,.4);border-radius:10px;padding:2px 8px}#ribbon .traits .ic{width:12px;height:12px}
.sys{height:32px;min-width:34px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:5px;color:#d8d1e6;background:linear-gradient(180deg,#241d2f,#15101d);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #3a3346}
.sys:hover{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #6a6280}
.sys span{font:400 12px var(--head)}
.sys.lit{color:var(--cyan);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px var(--cyan),0 0 10px rgba(34,225,255,.35)}

/* ---------- board ---------- */
#boardWrap{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 60% 40%,#1a1226,#07040b 75%);min-height:0}
canvas#board{display:block;border-radius:4px;box-shadow:0 0 0 2px #000,0 0 0 4px #4b5160,0 14px 40px rgba(0,0,0,.6);touch-action:none;cursor:default}
#boardWrap.alarm::after{content:"";position:absolute;inset:0;pointer-events:none;animation:alarm 1.6s ease 1}
@keyframes alarm{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,59,90,0)}20%,60%{box-shadow:inset 0 0 70px 6px rgba(255,59,90,.55)}40%,80%{box-shadow:inset 0 0 20px 0 rgba(255,59,90,.15)}}
#ribbon{position:absolute;top:14px;left:50%;transform:translate(-50%,-140%);background:linear-gradient(180deg,#1d1727,#100b16);box-shadow:0 0 0 1px #000,0 0 0 2px #7d8494,0 10px 30px rgba(0,0,0,.6);border-radius:8px;padding:8px 18px 10px;text-align:center;pointer-events:none;min-width:200px;opacity:0}
#ribbon::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#ribbon b{display:block;font:400 22px/1.1 var(--head)}#ribbon small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
#ribbon .foes{display:flex;gap:10px;justify-content:center;margin-top:6px}#ribbon .foes span{display:flex;align-items:center;gap:2px;font:400 12px var(--head);color:var(--muted)}#ribbon .foes canvas{width:26px;height:26px}
#ribbon.show{animation:drop 3s cubic-bezier(.2,.9,.3,1) 1}
@keyframes drop{0%{transform:translate(-50%,-140%);opacity:1}12%,82%{transform:translate(-50%,0);opacity:1}99%{transform:translate(-50%,-140%);opacity:1}100%{opacity:0}}
#neonSign{position:absolute;top:28%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#neonSign span{display:block;font:400 56px/1 var(--sign);color:#ffe3f1;text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 60px rgba(255,61,154,.7)}
#neonSign small{display:block;font:400 18px var(--head);color:#d4fbff;text-shadow:0 0 8px var(--cyan),0 0 18px var(--cyan);margin-top:10px}
#neonSign.show{animation:sign 2.8s linear 1}
@keyframes sign{0%{opacity:0}4%{opacity:1}6%{opacity:.2}9%{opacity:1}12%{opacity:.4}14%,85%{opacity:1}100%{opacity:0}}
#bossPlate{position:absolute;top:64px;right:0;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;background:linear-gradient(90deg,#2a0a14,#14070c);box-shadow:0 0 0 1px #000,0 0 0 2px var(--red),0 0 24px rgba(255,59,90,.45);border-radius:10px 0 0 10px;transform:translateX(110%);pointer-events:none}
#bossPlate canvas{width:56px;height:56px}#bossPlate b{display:block;font:400 20px var(--head);color:#ffd1dc}#bossPlate small{color:#ff9fb2;font-size:14px}
#bossPlate.show{animation:slide 3.4s cubic-bezier(.2,.9,.3,1) 1}
@keyframes slide{0%{transform:translateX(110%)}12%,85%{transform:translateX(0)}100%{transform:translateX(110%)}}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%) translateY(8px);background:#0b0612;box-shadow:0 0 0 1px #4a4357;padding:7px 16px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;font-weight:600;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
#hint{position:absolute;left:14px;bottom:14px;max-width:360px;background:rgba(11,6,18,.94);box-shadow:0 0 0 1px #3a3346;border-left:3px solid var(--cyan);padding:9px 13px;border-radius:4px;font-size:14px;color:#ddd5ea;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
#hint.show{opacity:1;transform:none}#hint b{color:#fff}

/* ---------- console ---------- */
#console{display:grid;grid-template-columns:1fr 318px 318px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),linear-gradient(180deg,#17121f,#0c0811);position:relative;min-height:0}
#console::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(180deg,#eef1f6,#7d8494)}
#console::after{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:var(--pink);box-shadow:0 0 10px var(--pink),0 0 2px #fff;opacity:.85}
#console>section{position:relative;padding:16px 14px 12px}
#table{overflow:visible}#console{overflow:visible}
#console>section+section::before{content:"";position:absolute;left:0;top:14px;bottom:10px;width:1px;background:linear-gradient(180deg,transparent,rgba(255,61,154,.55) 30%,rgba(34,225,255,.45) 70%,transparent);box-shadow:1px 0 0 #050308,0 0 6px rgba(255,61,154,.25)}

/* poker table */
#table{display:grid;place-items:stretch;min-width:0}
.felt{position:relative;border-radius:110px/80px;background:radial-gradient(ellipse at 50% 35%,#4b1866 0%,#2c0c3d 55%,#1a0624 100%);box-shadow:0 0 0 3px #050308,0 0 0 6px #c3c9d4,0 0 0 8px #4b5160,inset 0 0 40px rgba(0,0,0,.65);display:grid;grid-template-rows:62px 1fr;padding:8px 26px 8px;min-width:0}
.felt::before{content:"";position:absolute;inset:6px;border-radius:104px/76px;border:1px solid rgba(255,214,120,.18);pointer-events:none}
#seats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 8px}
.seat{position:relative;display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:6px;padding:5px 6px;border-radius:9px;transition:background .2s,box-shadow .2s;min-width:0}
.seat .av{width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:400 12px var(--head);color:#120a18;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);outline:2px dashed rgba(255,255,255,.75);outline-offset:-5px}
.seat .sinfo{min-width:0}.seat .sinfo b{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sinfo span{display:flex;align-items:center;gap:3px;color:#ffd27a;font:400 11px var(--head)}.seat .sinfo .ic{width:12px;height:12px;color:var(--amber)}
.seat .bld{width:28px;height:22px}
.seat .dealer{position:absolute;left:-4px;top:-4px;width:15px;height:15px;border-radius:50%;background:#f4ecff;color:#120a18;font:400 9px/15px var(--head);text-align:center;display:none;box-shadow:0 0 0 1.5px #050308}
.seat.isdealer .dealer{display:block}
.seat .sact{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:#0b0612;box-shadow:0 0 0 1px #6a6280;border-radius:9px;padding:1px 8px;font:400 9.5px/14px var(--head);white-space:nowrap;opacity:0;transition:opacity .15s;color:#e8e1f5}
.seat .sact.on{opacity:1}
.seat.turn{background:rgba(255,176,32,.12);box-shadow:0 0 0 1.5px var(--amber),0 0 14px rgba(255,176,32,.35)}
.seat.won{background:rgba(34,225,255,.1);box-shadow:0 0 0 1.5px var(--cyan),0 0 14px rgba(34,225,255,.35)}
.seat.folded{opacity:.5}
.seat .scards{display:none;position:absolute;inset:2px 4px auto 38px;gap:2px;align-items:center;flex-wrap:wrap;row-gap:1px}
.seat.showing .sinfo{visibility:hidden}.seat.showing .scards{display:flex}
.seat .scards i{font-style:normal;width:17px;height:24px;border-radius:3px;background:linear-gradient(170deg,#fffdf8,#e9e0cd);color:#1b1b22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 0 0 1px #050308,0 2px 4px rgba(0,0,0,.45);filter:brightness(.62) saturate(.7);transition:transform .2s}
.seat .scards i b{font:700 10.5px/1 var(--body);letter-spacing:-.6px}.seat .scards i .cs{width:8px;height:8px}
.seat .scards i.r{color:#c3122f}.seat .scards i.fc{box-shadow:0 0 0 1px #050308,inset 0 0 0 1.5px #e0b040,0 2px 4px rgba(0,0,0,.45)}
.seat .scards i.on{filter:none;transform:translateY(-2px);box-shadow:0 0 0 1px #050308,0 0 0 2.5px var(--amber),0 0 8px rgba(255,176,32,.55)}.seat .scards i.fc.on{box-shadow:0 0 0 1px #050308,inset 0 0 0 1.5px #e0b040,0 0 0 2.5px var(--amber),0 0 8px rgba(255,176,32,.55)}
.seat .scards em{font:400 9px var(--head);color:var(--amber);font-style:normal;width:100%}
.seat .stamp{display:none;position:absolute;inset:0;place-items:center;font:400 15px var(--head);color:var(--red);transform:rotate(-8deg);text-shadow:0 0 8px rgba(255,59,90,.6)}
.seat.out{filter:grayscale(.85);opacity:.55}.seat.out .stamp{display:grid}
#pot{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px;color:var(--amber);transition:opacity .2s}#pot b{font:400 15px var(--head);color:#ffd27a}#pot.dim{opacity:.3}
#mine{margin-top:12px;display:grid;grid-template-columns:160px auto 156px;gap:14px;align-items:center;justify-content:center;min-width:0}
#handInfo{min-width:0;position:relative}
#hName{font:400 15px/1.1 var(--head);color:#ffd27a;text-shadow:0 0 10px rgba(255,176,32,.35)}
#hDetail{color:#cfc6de;font-size:13.5px;margin-top:2px;min-height:17px}
#hUnit{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:700;font-size:13px}#hUnit canvas{width:40px;height:40px;flex:none}
#dealerMe{position:absolute;right:2px;top:-2px;width:16px;height:16px;border-radius:50%;background:#f4ecff;color:#120a18;font:400 9.5px/16px var(--head);text-align:center;display:none}#dealerMe.on{display:block}
#cards{display:flex;gap:8px}
.card{width:58px;height:84px;border-radius:7px;background:linear-gradient(170deg,#fffdf8,#ece4d4);color:#1b1b22;position:relative;box-shadow:0 0 0 1px #050308,0 6px 14px rgba(0,0,0,.5);transition:transform .15s;flex:none}
.card.red{color:#c8102e}
.card .ci{position:absolute;font:700 13px/.9 var(--body);text-align:center;width:10px;letter-spacing:-.6px}.card .ci .cs{display:block;width:8px;height:8px;margin:2px auto 0}
.card .ci.tl{top:4px;left:2px}.card .ci.br{bottom:4px;right:2px;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;line-height:1}
.card .court{position:absolute;top:4px;bottom:4px;left:11px;right:11px;width:calc(100% - 22px);height:calc(100% - 8px)}.card.face .ci{width:8px;left:2px}.card.ten .ci{font-size:12px;letter-spacing:-1.6px;width:11px;left:.5px}.card.ten .ci.br{left:auto;right:.5px}.card .pips{position:absolute;top:6px;bottom:6px;left:12px;right:12px;width:calc(100% - 24px);height:calc(100% - 12px)}.card.face .ci.br{left:auto;right:2px}
.card .ace{position:absolute;left:5px;right:5px;top:50%;width:calc(100% - 10px);height:auto;aspect-ratio:1;transform:translateY(-50%)}
#cards.pickable .card{cursor:pointer}#cards.pickable .card:hover{transform:translateY(-4px)}
.card.sel{transform:translateY(-14px)}
.card.sel::after{content:"";position:absolute;inset:0;border-radius:7px;background:rgba(40,10,60,.35);box-shadow:0 0 0 2px var(--cyan),0 0 12px rgba(34,225,255,.5)}
.card.score{box-shadow:0 0 0 1px #050308,0 0 0 3px var(--amber),0 0 14px rgba(255,176,32,.5)}
.card.dim{filter:grayscale(.6) brightness(.65)}
.card.back{background:var(--cardback) center/100% 100% no-repeat,#2a0b3d;box-shadow:0 0 0 1px #050308,0 6px 14px rgba(0,0,0,.5)}
.card.new{animation:dealIn .36s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes dealIn{from{transform:translate(180px,-90px) rotate(24deg);opacity:0}to{opacity:1}}
#pActions{display:flex;flex-direction:column;gap:6px;min-height:78px;justify-content:center}
.pb{height:30px;padding:0 12px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:5px;font:400 11.5px var(--head);color:#efe8fb;background:linear-gradient(180deg,#2a2236,#16101e);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #4a4357,0 2px 0 #050308;white-space:nowrap}
.pb:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #8a82a0,0 2px 0 #050308}
.pb:disabled{opacity:.35}
.pb .ic{width:13px;height:13px}
.pb.main{color:#1d0f00;background:linear-gradient(180deg,#ffd76a,#ffa000);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1px #5a3600,0 2px 0 #050308,0 0 14px rgba(255,176,32,.4)}
.pb.main:hover:not(:disabled){filter:brightness(1.08)}
.pb.main em{font-style:normal;font:600 11px var(--body);background:rgba(0,0,0,.18);border-radius:8px;padding:1px 6px;margin-left:4px}
.pb.fold{color:#ffc2cd;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #7a2a3a,0 2px 0 #050308}
.tips3{display:flex;gap:5px}.tips3 .pb{flex:1;padding:0 6px}
.pmsg{font-size:14px;color:#cfc6de;text-align:center}.pmsg b{font:400 18px var(--head);color:#fff;margin-right:4px}.pmsg.res{font-size:13px;line-height:1.3}
#tbarWrap{height:3px;background:#2a2235;border-radius:2px;overflow:hidden;margin-top:2px}#tbar{height:100%;width:0;background:var(--amber);box-shadow:0 0 6px var(--amber);transition:width .12s linear}

/* selection pane */
#unitPane{display:flex;flex-direction:column;gap:10px;min-width:0}
.ph{display:flex;gap:12px;align-items:center}
.por{width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a2a4f,#120c19 70%);box-shadow:0 0 0 2px #050308,0 0 0 4px #7d8494,inset 0 -10px 18px rgba(0,0,0,.5)}
.pmain{min-width:0;flex:1}
.pname{font:400 16px/1.1 var(--head)}.porig{color:var(--muted);font-size:13px;margin-top:2px}
.hp{height:6px;background:#2a2235;border-radius:3px;overflow:hidden;margin-top:7px}.hp i{display:block;height:100%;background:#4ade80;transition:width .2s}
.hpt{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.st{display:flex;align-items:center;gap:4px;color:var(--muted)}.st .ic{width:14px;height:14px}.st b{font:400 12px var(--head);color:var(--ink)}
.recipes{display:flex;gap:6px;flex-wrap:wrap}
.rcp{display:flex;align-items:center;gap:2px;padding:3px 6px;border-radius:8px;background:linear-gradient(180deg,#241d2f,#15101d);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #4a4357;color:#e5b8ff}
.rcp canvas{width:30px;height:30px}.rcp .ic{width:14px;height:14px}
.rcp:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #c084fc,0 0 10px rgba(192,132,252,.35)}.rcp:disabled{opacity:.35}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.mu{position:relative;width:48px;height:48px;border-radius:9px;background:radial-gradient(circle at 50% 40%,#2e2340,#120c19);box-shadow:0 0 0 1px #4a4357}.mu:hover{box-shadow:0 0 0 1px #8a82a0}
.mu canvas{width:40px;height:40px;margin:4px}.mu b{position:absolute;right:3px;bottom:1px;font:400 11px var(--head);color:#ffd27a}
.mergebig{align-self:flex-start;height:34px;padding:0 16px}

/* command card */
#cmd,#afCmd{display:grid;grid-template-columns:repeat(5,52px);grid-template-rows:repeat(3,52px);gap:7px;align-content:center;justify-content:center}
.slot{position:relative;border-radius:10px;display:grid;place-items:center;color:#ece6f7;background:radial-gradient(circle at 50% 30%,#2c2438,#130e1a 75%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -3px 0 rgba(0,0,0,.55),0 0 0 1px #3f3850,0 2px 0 #050308;transition:box-shadow .12s,color .12s}
.slot .ic{width:23px;height:23px}
.slot:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.55),0 0 0 1px var(--cyan),0 0 10px rgba(34,225,255,.3);color:#fff}
.slot:active:not(:disabled){transform:translateY(1px)}
.slot:disabled{opacity:.32}
.slot.lit{color:#ffd2e8;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1.5px var(--pink),0 0 14px rgba(255,61,154,.55)}

/* damage meter */
.dmeter{margin-top:8px;display:flex;flex-direction:column;gap:3px}.dmeter h5{margin:0 0 2px;font:400 10px var(--head);color:var(--muted);letter-spacing:.06em}
.dmeter div{display:grid;grid-template-columns:20px 1fr 54px;align-items:center;gap:6px;font-size:12px}.dmeter canvas{width:20px;height:20px}.dmeter i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#f59e0b,#fde68a)}.dmeter em{font-style:normal;color:#ffd27a;font:400 11px var(--head);text-align:right}
/* settings */
.setgrid{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center;text-align:left;margin:10px auto 0;max-width:420px}
.setgrid label{color:#e7e0f0;font-size:15px}.setgrid small{display:block;color:var(--muted);font-size:12.5px}
.setgrid input[type=range]{width:170px;accent-color:#ff3d9a}.setgrid input[type=checkbox]{width:18px;height:18px;accent-color:#ff3d9a}
/* hp graph */
.hpgraph{margin:14px auto 0;max-width:620px}.hpgraph svg{width:100%;height:auto;display:block}.hpgraph small{display:block;color:var(--muted);font-size:12px;text-align:left;margin-bottom:4px}

.achpop{position:fixed;right:18px;top:64px;z-index:80;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:linear-gradient(180deg,#2a1f12,#140d06);box-shadow:0 0 0 1px #000,0 0 0 2px #fbbf24,0 0 24px rgba(251,191,36,.35),0 10px 30px rgba(0,0,0,.6);transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:320px}
.achpop.show{transform:none}.achpop .ic{width:28px;height:28px;color:#fbbf24;flex:none}.achpop small{font:400 9.5px var(--head);color:#fbbf24;letter-spacing:.1em}.achpop b{display:block;font:400 14px var(--head);color:#fff3d6}.achpop span{font-size:12.5px;color:#d6c7a8}
.tabs{display:flex;gap:6px;justify-content:center;margin:4px 0 12px}.tabs button{padding:7px 14px;border-radius:9px;color:#cfc6dd;background:#15101d;box-shadow:0 0 0 1px #3f3850;font-size:13px}.tabs button.on{background:#2c2240;color:#fff;box-shadow:0 0 0 1px var(--pink)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.coll div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:9px;background:#18121f;box-shadow:0 0 0 1px #362f42;text-align:center}
.coll canvas{width:46px;height:46px}.coll b{font-size:11.5px;line-height:1.2}.coll .un{opacity:.45}.coll .un span{width:46px;height:46px;display:grid;place-items:center;font:400 24px var(--head);color:#5b5168}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.achs>div{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;background:#18121f;box-shadow:0 0 0 1px #362f42;opacity:.5;text-align:left}
.achs>div.on{opacity:1;box-shadow:0 0 0 1px rgba(251,191,36,.6)}.achs .ic{width:22px;height:22px;color:#fbbf24;flex:none}.achs b{display:block;font-size:13.5px}.achs span{font-size:12px;color:var(--muted)}.achs em{margin-left:auto;font-style:normal;font-size:11px;color:#fbbf24;white-space:nowrap}
.hist{width:100%;border-collapse:collapse;font-size:13px;text-align:left}.hist th{color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid #362f42}.hist td{padding:6px;border-bottom:1px solid #231c2c}.hist .w{color:#86efac}.hist .l{color:#fda4af}

.lbchat{margin-top:14px;text-align:left;border-radius:10px;background:#120d18;box-shadow:0 0 0 1px #362f42;padding:8px}
#lbChat{max-height:110px;overflow-y:auto;font-size:13px;line-height:1.35;display:flex;flex-direction:column;gap:2px;padding:2px 4px 6px;color:#d8d1e6}#lbChat .sys{color:var(--muted);font-style:italic}
#lbChatIn{width:100%;height:30px;border:0;border-radius:7px;background:#0d0912;color:#fff;padding:0 10px;font-size:13px;box-shadow:inset 0 0 0 1px #3f3850}#lbChatIn:focus{outline:none;box-shadow:inset 0 0 0 1px var(--cyan)}
body.spectate #rChips,body.spectate #rHp,body.spectate #rArmy,body.spectate #rNext,body.spectate .res.chips,body.spectate #cmd,body.spectate #unitPane{opacity:.25;pointer-events:none}
body.spectate #seats{grid-template-columns:repeat(6,1fr)}

.sigs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sigs div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:9px;background:#18121f;box-shadow:0 0 0 1px #362f42;text-align:center}
.sigs canvas{width:40px;height:40px}.sigs span{width:40px;height:40px;display:grid;place-items:center;font:400 20px var(--head);color:#5b5168}.sigs b{font-size:11.5px;color:#ffd27a}.sigs small{font-size:11.5px;color:var(--muted)}
.mx.un{opacity:.5}.mx .q{width:26px;height:26px;display:inline-grid;place-items:center;font:400 14px var(--head);color:#5b5168;background:#120d18;border-radius:6px}

/* ---------- table nights and the slot machine ---------- */
.mg,#slotPanel{position:fixed;z-index:40;background:linear-gradient(180deg,#1a1024,#0e0814);border-radius:14px;padding:14px 16px 16px;color:var(--ink);box-shadow:0 0 0 1px #000,0 0 0 2px var(--amber),0 0 34px rgba(255,176,32,.35),0 20px 60px rgba(0,0,0,.7)}
.mg{left:50%;top:44%;transform:translate(-50%,-50%);width:440px;animation:mgIn .35s cubic-bezier(.2,1.4,.4,1)}
.mg.roulette{box-shadow:0 0 0 1px #000,0 0 0 2px #39d98a,0 0 34px rgba(57,217,138,.35),0 20px 60px rgba(0,0,0,.7)}
@keyframes mgIn{from{opacity:0;transform:translate(-50%,-46%) scale(.9)}}
.mghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mghead b{font:400 22px/1 var(--sign);color:#ffe9b0;text-shadow:0 0 6px var(--amber),0 0 16px rgba(255,176,32,.6);flex:1}
.mg.roulette .mghead b{color:#d6ffe9;text-shadow:0 0 6px #39d98a,0 0 16px rgba(57,217,138,.6)}
.mghead span{display:flex;align-items:center;gap:4px;font:400 14px var(--head);color:var(--amber)}.mghead .ic{width:15px;height:15px}
.mgx{background:none;border:0;color:var(--muted);font:400 12px var(--head);cursor:pointer;padding:4px 6px}.mgx:hover{color:var(--ink)}
.mgtime{height:3px;background:#2a2236;border-radius:2px;margin-bottom:12px;overflow:hidden}.mgtime i{display:block;height:100%;width:100%;background:var(--amber);box-shadow:0 0 8px var(--amber);transition:width .25s linear}
.mglead{font-size:14px;color:#d8cfe6;margin:0 0 10px;line-height:1.35}.mglead em{color:var(--amber);font-style:normal}
.mgbets{display:flex;gap:6px;justify-content:center;margin-bottom:10px}.mgbets .pb.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px var(--amber),0 0 10px rgba(255,176,32,.4)}
.mgrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.rougrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rb{height:44px;border-radius:8px;border:0;cursor:pointer;font:400 14px var(--head);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#241b30;box-shadow:inset 0 0 0 1px #4a4357}
.rb small{font-size:10px;opacity:.7}.rb.red{background:#7f1d1d}.rb.black{background:#111827}.rb.zero{background:#14532d;grid-column:span 1}
.rb.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 12px rgba(255,176,32,.45)}.rb:hover{filter:brightness(1.2)}
#rouCv{display:block;margin:0 auto;width:300px;height:300px}
.mgres{text-align:center;font:400 16px var(--head);margin-top:8px;min-height:22px}.mgres b{display:inline-block;min-width:30px;padding:2px 8px;border-radius:12px;margin-right:4px}
.mgres b.red{background:#b91c1c}.mgres b.black{background:#111827;box-shadow:0 0 0 1px #555}.mgres b.green{background:#15803d}
.bjrow{margin-bottom:10px}.bjrow small{display:block;color:var(--muted);font:400 12px var(--head);margin-bottom:5px}.bjcards{display:flex;gap:6px;min-height:84px}
#slotPanel{right:18px;top:58px;width:300px;box-shadow:0 0 0 1px #000,0 0 0 2px var(--pink),0 0 30px rgba(255,61,154,.35),0 20px 60px rgba(0,0,0,.7);animation:slIn .3s ease-out}
@keyframes slIn{from{opacity:0;transform:translateY(-10px)}}
#slotPanel .mghead b{color:#ffd9ec;text-shadow:0 0 6px var(--pink),0 0 16px rgba(255,61,154,.6)}
.reels{display:flex;gap:8px;justify-content:center;padding:10px;background:#07040b;border-radius:10px;box-shadow:inset 0 0 0 2px #3a3346,inset 0 8px 18px rgba(0,0,0,.8)}
.reel{width:70px;height:78px;border-radius:7px;background:linear-gradient(180deg,#cfc6d8,#fffdf8 30%,#fffdf8 70%,#cfc6d8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.reel.spin .sg{animation:reelBlur .09s linear infinite}@keyframes reelBlur{0%{transform:translateY(-14px);filter:blur(1.5px)}100%{transform:translateY(14px);filter:blur(1.5px)}}
.sg{font:900 30px/1 var(--head);display:flex}.sg .ic{width:40px;height:40px;stroke-width:2.2}.sg.bar{font-size:20px;color:#1b1b22!important;padding:3px 6px;border:3px solid #1b1b22;border-radius:5px}.sg.seven{font-size:46px;text-shadow:0 2px 0 #7f1d1d}
.slres{text-align:center;font:400 14px var(--head);margin-top:10px;min-height:20px;color:#ffe9b0}
.paytab{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.paytab span{display:flex;align-items:center;gap:3px}.paytab .sg{font-size:13px}.paytab .sg .ic{width:14px;height:14px}.paytab .sg.bar{font-size:8px;border-width:1.5px;padding:1px 2px;color:#e5e7eb!important;border-color:#e5e7eb}.paytab .sg.seven{font-size:15px}
.pb.slotb{margin:8px auto 0;height:26px}
.achs>div.secret{background:#140f1c;box-shadow:0 0 0 1px #4c1d95}.achs>div.secret .ic{color:#c084fc}.achs>div.secret.on{box-shadow:0 0 0 1px #c084fc,0 0 10px rgba(192,132,252,.3)}
.achpop.secret{box-shadow:0 0 0 1px #000,0 0 0 2px #c084fc,0 0 24px rgba(192,132,252,.5);background:linear-gradient(180deg,#24123a,#10081a)}.achpop.secret .ic,.achpop.secret small{color:#d8b4fe}

#slotPanel.arc-dog{width:396px}
.arctabs{display:flex;gap:4px;margin-bottom:10px}.arctabs button{flex:1;height:26px;border:0;border-radius:13px;background:#241b30;color:var(--muted);font:400 11.5px var(--head);cursor:pointer;box-shadow:inset 0 0 0 1px #3a3346}
.arctabs button.on{color:#1d0f00;background:linear-gradient(180deg,#ff8cc6,#ff3d9a);box-shadow:none}
#dogCv,#derbyCv{display:block;width:100%;border-radius:8px;box-shadow:0 0 0 1px #000,0 0 0 2px #3a3346;margin-bottom:8px}
.runners{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.runner{display:flex;align-items:center;gap:6px;height:28px;border:0;border-radius:7px;background:#1d1626;color:#e9e1f5;font:400 12px var(--body,Barlow),sans-serif;padding:0 8px;cursor:pointer;box-shadow:inset 0 0 0 1px #3a3346;text-align:left;white-space:nowrap;overflow:hidden}
.runner i{font-style:normal;display:inline-flex;width:16px;height:16px;border-radius:3px;align-items:center;justify-content:center;font:700 10px var(--head);color:#fff;flex:none}
.runner b{margin-left:auto;color:var(--amber);font:400 12px var(--head)}.runner.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 10px rgba(255,176,32,.35)}.runner:disabled{opacity:.7;cursor:default}
.mg.derby{width:440px;box-shadow:0 0 0 1px #000,0 0 0 2px #4ade80,0 0 34px rgba(74,222,128,.3),0 20px 60px rgba(0,0,0,.7)}.mg.derby .mghead b{color:#dcfce7;text-shadow:0 0 6px #22c55e,0 0 16px rgba(34,197,94,.6)}

.mg.sports{width:480px;top:50%;max-height:94vh;overflow-y:auto;box-shadow:0 0 0 1px #000,0 0 0 2px #60a5fa,0 0 34px rgba(96,165,250,.3),0 20px 60px rgba(0,0,0,.7)}.mg.sports .mghead b{color:#dbeafe;text-shadow:0 0 6px #3b82f6,0 0 16px rgba(59,130,246,.6)}
.mg.mini>*:not(.mghead):not(.mgtime){display:none}.mg.mini{top:auto;bottom:230px;transform:translateX(-50%)}
.mglead.small{font-size:12.5px;margin:6px 0}
.sbgames{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sbgame{padding:6px 8px 7px;border-radius:9px;background:#140f1c;box-shadow:inset 0 0 0 1px #2e2739}.sbgame.mine{box-shadow:inset 0 0 0 1px #60a5fa,0 0 10px rgba(96,165,250,.2)}
.sbgame small{display:block;font:400 10px var(--head);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.sbrow{display:flex;align-items:center;gap:6px}.sbrow em{font:400 11px var(--head);color:var(--dim);font-style:normal}
.sbside{flex:1;display:flex;align-items:center;gap:6px;height:32px;border:0;border-radius:8px;background:#1d1626;color:#efe8fb;padding:0 8px;cursor:pointer;box-shadow:inset 0 0 0 1px #3a3346;font:400 13px Barlow,sans-serif}
.sbside b{margin-left:auto;font:400 13px var(--head);color:var(--amber)}.sbside.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 10px rgba(255,176,32,.35)}
.sbside.win{background:#14301f;box-shadow:inset 0 0 0 2px #4ade80}.sbside.lose{opacity:.45}.sbside:disabled{cursor:default}
.sbface{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font:400 11px var(--head);color:#0b0612;flex:none}
.sbbar{height:6px;border-radius:3px;background:#dc2626;margin-top:6px;overflow:hidden}.sbbar i{display:block;height:100%;width:50%;background:#3b82f6;transition:width .12s linear}
.sbros{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px}
.sbu{position:relative;width:46px;height:46px;border:0;border-radius:8px;background:#1d1626;box-shadow:inset 0 0 0 1px #3a3346;cursor:pointer;padding:0}.sbu canvas{width:34px;height:34px}
.sbu.prot{box-shadow:inset 0 0 0 2px #60a5fa,0 0 10px rgba(96,165,250,.4)}.sbu.prot .ic{position:absolute;right:2px;top:2px;width:13px;height:13px;color:#93c5fd}.sbu.on{box-shadow:inset 0 0 0 2px var(--amber)}
.sbarena{display:block;width:100%;margin-top:6px;border-radius:6px;box-shadow:0 0 0 1px #000,0 0 0 2px #2e4a36}

#afPane,#afCmd,body #afCmd{display:none}body.fighting #unitPane,body.fighting #cmd{display:none}body.fighting #afPane{display:flex;flex-direction:column;gap:10px;min-width:0}body.fighting #afCmd{display:grid}
.afgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.afgrid button{position:relative;height:50px;border:0;border-radius:8px;background:#1d1626;box-shadow:inset 0 0 0 1px #3a3346;cursor:pointer;padding:0}.afgrid canvas{width:38px;height:38px}
.afgrid i{position:absolute;left:5px;right:5px;bottom:4px;height:3px;background:#2a2235;border-radius:2px;overflow:hidden}.afgrid i b{display:block;height:100%;background:#4ade80}
.afscore .afrow{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;align-items:center;margin-bottom:8px}.afscore .afrow b{font:400 15px var(--head);color:#93c5fd}.afscore .afrow.foe b{color:#fca5a5}.afscore .afrow span{font-size:12.5px;color:var(--muted)}
.afscore .afrow i{grid-column:1/3;height:7px;background:#2a2235;border-radius:4px;overflow:hidden}.afscore .afrow em{display:block;height:100%;background:#60a5fa}.afscore .afrow.foe em{background:#f87171}.afscore p{font-size:12.5px;color:var(--muted);margin:4px 0 0}

/* ---------- title screen ---------- */
#overlay.title{background:radial-gradient(ellipse 70% 60% at 50% 32%,rgba(96,24,128,.6),rgba(8,3,14,.95) 76%);overflow:hidden}
#overlay.title::before,#overlay.title::after{content:"";position:absolute;top:-30%;width:70vw;height:160%;transform-origin:50% 0;pointer-events:none;animation:beam 11s ease-in-out infinite alternate}
#overlay.title::before{left:-22vw;background:conic-gradient(from 168deg at 50% 0%,transparent 0deg,rgba(255,61,154,.13) 10deg,rgba(255,61,154,.02) 22deg,transparent 24deg)}
#overlay.title::after{right:-22vw;background:conic-gradient(from 168deg at 50% 0%,transparent 0deg,rgba(34,225,255,.11) 10deg,rgba(34,225,255,.02) 22deg,transparent 24deg);animation-direction:alternate-reverse;animation-duration:13s}
@keyframes beam{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.modal.menu.title{background:none;box-shadow:none;position:relative;z-index:1;overflow:visible;width:min(700px,96vw)}
.ttl{position:relative;display:flex;flex-direction:column;align-items:center;margin:0 auto 26px}
.ttl .fan{position:relative;height:128px;width:360px;margin-bottom:-36px}
.ttl .fan .card{position:absolute;left:50%;bottom:0;margin-left:-36px;width:72px;height:104px;transform-origin:50% 140%;transform:rotate(var(--a));animation:fanIn .8s cubic-bezier(.2,.8,.3,1.15) var(--d) both;box-shadow:0 0 0 1px #050308,0 8px 18px rgba(0,0,0,.6)}
@keyframes fanIn{from{transform:rotate(0) translateY(46px);opacity:0}to{transform:rotate(var(--a))}}
.ttl .fan .card .ci{font-size:15px;width:11px}.ttl .fan .card.face .ci{width:10px}.ttl .fan .card .ci .cs{width:9px;height:9px}.ttl .fan .card .court{left:13px;right:13px;width:calc(100% - 26px)}
.ttl .sign{position:relative;z-index:1;padding:22px 52px 18px;border-radius:20px;background:linear-gradient(180deg,#2a1236,#11071a);box-shadow:0 0 0 2px #e0b040,0 0 0 6px #2a1206,0 0 0 7.5px #e0b040,0 22px 60px rgba(0,0,0,.75),0 0 80px rgba(255,61,154,.28)}
.ttl .sign .logo.big{margin:0;font-size:90px;line-height:1}
.ttl .tagl{font:400 13px var(--head);letter-spacing:.55em;padding-left:.55em;color:#ffcf7a;margin-top:10px;text-shadow:0 0 8px rgba(255,176,32,.65)}
.ttl .bulbs{position:absolute;inset:0;pointer-events:none}
.ttl .bulbs i{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff1c2;box-shadow:0 0 6px 2px rgba(255,190,70,.8);animation:chase 1.1s steps(1) infinite}
.ttl .bulbs i.b{animation-delay:.55s}
@keyframes chase{0%{opacity:1}50%{opacity:.22;box-shadow:none}}
.ttl .stk{position:absolute;bottom:-14px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}.ttl .stk svg{display:block}
.ttl .stk.l{left:-112px}.ttl .stk.r{right:-110px}


@media (max-width:760px){.ttl .stk{display:none}.ttl .sign .logo.big{font-size:64px}.ttl .sign{padding:18px 30px 14px}}

/* ---------- phone / touch notice ---------- */
#gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 90% 60% at 50% 30%,#4a1462,#0a0410 75%)}
#gate .gbox{max-width:420px;text-align:center}
#gate .gsign{display:inline-block;padding:14px 26px 12px;border-radius:16px;background:linear-gradient(180deg,#2a1236,#11071a);box-shadow:0 0 0 2px #e0b040,0 0 0 5px #2a1206,0 0 0 6.5px #e0b040,0 0 60px rgba(255,61,154,.3);margin-bottom:22px}
#gate .gsign .logo{font-size:54px;margin:0;line-height:1}
#gate h2{font:400 20px var(--head);color:#ffcf7a;margin:0 0 10px;letter-spacing:.02em}
#gate p{font-size:16.5px;line-height:1.45;color:#e9e3f2;margin:0 0 22px}
#gate .gbtns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
#gate .gbtns .pb{height:46px;font-size:14px;border-radius:23px}
#gate .glook{margin-top:16px;background:none;border:0;color:var(--muted);font:600 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.buildtag{position:fixed;right:12px;bottom:8px;z-index:31;font:500 11.5px var(--body);color:rgba(233,227,242,.38);letter-spacing:.03em;pointer-events:auto;user-select:text;-webkit-user-select:text}

/* ---------- game feel overlays ---------- */
.feelflash,.feelhurt{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0}
.feelflash{background:radial-gradient(ellipse at 50% 50%,var(--fc),transparent 70%);mix-blend-mode:screen}
.feelflash.go{animation:fflash .55s ease-out 1}
@keyframes fflash{0%{opacity:var(--fa)}100%{opacity:0}}
.feelhurt{box-shadow:inset 0 0 80px 18px rgba(255,30,60,.85),inset 0 0 0 3px rgba(255,59,90,.6);border-radius:6px}
.feelhurt.go{animation:fhurt .5s ease-out 1}
@keyframes fhurt{0%{opacity:var(--ha)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.feelflash.go{animation-duration:.3s}.feelflash{display:none}}

/* ---------- table awards, rematch, open tables ---------- */
.awards{margin:14px 0 4px}.awards h4,.otwrap h4{font:400 13px var(--head);color:#ffcf7a;letter-spacing:.06em;margin:0 0 8px;text-align:center}
.awards .arow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.award{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:112px;padding:10px 10px 8px;border-radius:10px;background:linear-gradient(180deg,#241a2e,#140e1a);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px #3f3850}
.award.mine{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1.5px var(--amber),0 0 14px rgba(255,176,32,.25)}
.award .aic{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:rgba(255,176,32,.14);color:#ffcf7a}.award .aic .ic{width:15px;height:15px}
.award b{font:400 12px var(--head);color:#fff4e0;margin-top:3px}.award em{font-style:normal;font-weight:700;font-size:14px;color:#ffd27a}.award small{color:var(--muted);font-size:12.5px}
#eRm .rdy{color:#86efac}
.otwrap{margin-top:14px;text-align:left}
#openTables{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.otab{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:linear-gradient(180deg,#221b2c,#130e19);box-shadow:0 0 0 1px #3f3850}
.otab b{font-weight:700;font-size:14.5px}.otab small{grid-row:2;color:var(--muted);font-size:12.5px}.otab .pb{grid-row:1/3;grid-column:2;height:32px;padding:0 16px;font-size:12px;border-radius:16px}

.slot.empty{background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);border-radius:10px}
.por.ring{box-shadow:0 0 0 2px #050308,0 0 0 4px var(--ring),0 0 14px color-mix(in srgb,var(--ring) 45%,transparent),inset 0 -10px 18px rgba(0,0,0,.5)}

/* steady top bar: every number gets a slot wide enough for its biggest value, so neighbours never shift */
.res b{display:inline-block;text-align:left;white-space:nowrap}
#rChips{min-width:4.7ch}#rHp{min-width:4.7ch}#rRound{min-width:4.6ch}#rRivals{min-width:1.3ch}#rArmy{min-width:2.4ch}
/* betting: fold and call side by side, raise underneath, so the table never grows past its row */
#pActions .betrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}#pActions .betrow .pb{padding:0 8px;min-width:0}

#top{min-width:0;overflow:hidden}#top>*{flex-shrink:0}#top .res{flex:none}#top #rNext{flex:0 1 auto;flex-shrink:1;min-width:0;overflow:hidden}#top .spacer{flex:1 1 0;min-width:0}
@media (max-width:1500px){#top{gap:14px}}@media (max-width:1300px){#top{gap:10px}}#top #rNext .nl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-height:780px){#pot{margin-bottom:2px}#pActions{min-height:66px;gap:4px}#pActions .pb{height:28px}.tipfx{margin:-3px 0}#tbarWrap{margin-top:1px}#mine{margin-top:8px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">ALL IN</div>
    <div class="res chips" data-tip="Chips|Pay antes, bets, ropes and upgrades" data-icon="chips"><b id="rChips">0</b></div>
    <div class="res" data-tip="Your casino|Bad luck that reaches it does damage" data-icon="casino"><b id="rHp">100</b><div class="minibar"><i id="rHpBar"></i></div></div>
    <div class="res" data-tip="Round" data-icon="round"><b id="rRound">0</b></div>
    <div class="res" data-tip="Rival casinos still open" data-icon="rivals"><b id="rRivals">5</b></div>
    <div class="res" data-tip="Your creatures" data-icon="army"><b id="rArmy">0</b></div>
    <div class="res nextw" id="rNext"></div>
    <div class="res room" id="rRoom" data-icon="users"></div>
    <div class="spacer"></div>
    <button class="sys" id="btnSlots" data-tip="Penny Arcade (J): slots, Megaways and the dog track"></button>
    <button class="sys" id="btnLog" data-tip="Table log (L)"></button>
    <button class="sys" id="btnEmote" data-tip="Say something (T)"></button>
    <button class="sys" id="btnRoute" data-tip="Bad-luck route (P)"></button>
    <button class="sys" id="btnSpeed" data-tip="Game speed (F)"></button>
    <button class="sys" id="btnPause" data-tip="Pause (Space)"></button>
    <button class="sys lit" id="btnMusic" data-tip="Music"></button>
    <button class="sys" id="btnMute" data-tip="All sound"></button>
    <button class="sys" id="btnSet" data-tip="Settings"></button>
    <button class="sys" id="btnHelp" data-tip="How to play"></button>
  </header>
  <main id="boardWrap">
    <canvas id="board"></canvas>
    <div id="ribbon"></div><div id="neonSign"></div><div id="bossPlate"></div>
    <div id="hint"></div><div id="toast"></div><div id="roundCard"></div>
    <div id="logPanel"><div class="lh"><b>Table log</b><span id="logCount"></span><button id="logMore" data-tip="Expand (L)"></button></div><div id="logList"></div><form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="120" placeholder="Chat with the table (press / to type)"></form></div>
    <div id="peek"><div class="pkh"><b id="pkName"></b><span id="pkInfo"></span><button id="pkBig" data-tip="Watch full size"></button><button id="pkX" data-tip="Stop watching (Esc)"></button></div><canvas id="pkCv"></canvas></div>
    <div id="watchBar"><span class="dot"></span><b id="wbName"></b><span id="wbInfo"></span><button class="pb" id="wbSmall">Shrink</button><button class="pb main" id="wbBack">Back to my casino</button></div>
  </main>
  <footer id="console">
    <section id="table"><div class="felt">
      <div id="seats"></div>
      <div id="mine">
        <div id="handInfo"><div id="dealerMe" data-tip="You have the dealer button">D</div><div id="hName"></div><div id="hDetail"></div><div id="hUnit"><canvas></canvas><span></span></div></div>
        <div id="cardsWrap"><div id="cards"></div><div class="bubble" id="myBubble"></div></div>
        <div><div id="pot" data-tip="The pot" data-icon="chips"><b id="potAmt">0</b><span id="evBadge"></span></div><div id="pActions"></div><div id="tbarWrap"><div id="tbar"></div></div></div>
      </div>
    </div></section>
    <section id="unitPane"></section>
    <section id="afPane"></section>
    <section id="cmd"></section>
    <section id="afCmd"></section>
  </footer>
</div>
<div id="tip"></div>
<div id="emotes"></div>
<div id="overlay"><div class="modal" id="modal"></div></div>

<script src="arcade.js"></script>
<script src="sports.js"></script>

</body>
